id = "johnschmidt/winboat"
name = "WinBoat"
version = "1.1.3"
plugin_api = 23
author = "johnschmidt"
license = "MIT"
dependencies = []
tags = ["docker", "windows", "indicator", "system", "panel"]
icon = "brand-windows"
description = "Shows the WinBoat container state and lets you start or stop it."

[[setting]]
key = "runtime"
type = "select"
label_key = "settings.runtime.label"
description_key = "settings.runtime.description"
default = "docker"
options = [
  { value = "docker", label_key = "settings.runtime.docker" },
  { value = "podman", label_key = "settings.runtime.podman" },
]

[[setting]]
key = "container_name"
type = "string"
label_key = "settings.container_name.label"
description_key = "settings.container_name.description"
default = "WinBoat"

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 5
min = 2
max = 60
step = 1

[[setting]]
key = "open_command"
type = "string"
label_key = "settings.open_command.label"
description_key = "settings.open_command.description"
default = "~/.local/bin/winboat-rdp"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  default = true

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "brand-windows"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 320
height = 255
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"
